pluginManagement {
	repositories {
		maven {
			name "Quilt"
			url "https://maven.quiltmc.org/repository/release"
		}
		maven {
			name "Fabric"
			url "https://maven.fabricmc.net/"
		}
		gradlePluginPortal()
	}
}

dependencyResolutionManagement {
	versionCatalogs {
		libs {
			def mc = "1.21.11"
			def mappings = 4

			version("minecraft", mc)
			version("mappings", "${mc}+build.${mappings}")

			library("minecraft", "com.mojang", "minecraft").versionRef("minecraft")
			library("minecraft-mappings", "net.fabricmc", "yarn").versionRef("mappings")
			library("fabric-loader", "net.fabricmc:fabric-loader:0.18.4")

			library("fabric-api", "net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11")
			library("nucleoid-plasmid", "xyz.nucleoid:plasmid:0.6.7-SNAPSHOT+${mc}")
		}
	}
}

rootProject.name = "quakecraft"
